<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff8fb1">
<title>С Днём Рождения! 🎂</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: linear-gradient(135deg, #ff9ecd 0%, #ffb88c 30%, #ffd93d 55%, #6bcbff 80%, #b28dff 100%);
    background-size: 300% 300%;
    animation: bgShift 18s ease infinite;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  @keyframes bgShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  /* Мягкое световое пятно для объёма */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.45) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.35) 0%, transparent 45%);
    pointer-events: none; z-index: 0;
  }
  #floaties {
    position: fixed; inset: 0;
    pointer-events: none; overflow: hidden; z-index: 1;
  }
  #floaties span {
    position: absolute; font-size: 30px; opacity: 0;
    animation: floatUp linear infinite;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.15));
  }
  #floaties span:nth-child(1) { left: 8%;  animation-duration: 13s; animation-delay: 0s; }
  #floaties span:nth-child(2) { left: 22%; animation-duration: 16s; animation-delay: 2s; font-size: 22px; }
  #floaties span:nth-child(3) { left: 52%; animation-duration: 14s; animation-delay: 4s; }
  #floaties span:nth-child(4) { left: 73%; animation-duration: 17s; animation-delay: 1s; font-size: 34px; }
  #floaties span:nth-child(5) { left: 88%; animation-duration: 15s; animation-delay: 3s; font-size: 20px; }
  @keyframes floatUp {
    0%   { bottom: -60px; transform: translateX(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.85; }
    90%  { opacity: 0.85; }
    100% { bottom: 105%;  transform: translateX(40px) rotate(360deg); opacity: 0; }
  }
  #viewer {
    position: fixed; inset: 0; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    perspective: 1300px;
    perspective-origin: 50% 50%;
    touch-action: none; overflow: hidden;
  }
  #card {
    width: min(90vw, calc(90vh * 1.4133), 595px);
    aspect-ratio: 595 / 421;
    position: relative;
    transform-style: preserve-3d;
    will-change: transform;
  }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 16px;
    background: #fff;
    box-shadow:
      0 30px 70px -12px rgba(120, 40, 90, 0.5),
      0 12px 30px rgba(0, 0, 0, 0.22),
      0 0 0 3px rgba(255, 255, 255, 0.7),
      0 0 0 4px rgba(255, 255, 255, 0.25);
  }
  .face img {
    width: 100%; height: 100%;
    display: block;
    object-fit: cover;
    border-radius: 16px;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  #back-face { transform: rotateY(180deg); }
  #hint {
    position: fixed;
    bottom: max(24px, env(safe-area-inset-bottom, 24px));
    left: 50%; transform: translateX(-50%);
    color: #4a1d3d;
    font-size: 13px; white-space: nowrap;
    font-weight: 600;
    padding: 11px 20px;
    background: rgba(255,255,255,0.75);
    border: 1px solid rgba(255,255,255,0.95);
    border-radius: 30px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 6px 20px rgba(120, 40, 90, 0.2);
    transition: opacity 0.8s ease;
    z-index: 10;
    letter-spacing: 0.3px;
    pointer-events: none;
  }
  #hint.hidden { opacity: 0; }
</style>
</head>
<body>
<div id="floaties">
  <span>🎈</span><span>🎂</span><span>🎉</span><span>🎁</span><span>✨</span>
</div>
<div id="viewer">
  <div id="card">
    <div class="face" id="front-face"><img src="front.png" alt="Лицевая сторона"></div>
    <div class="face" id="back-face"><img src="back.png" alt="Обратная сторона"></div>
  </div>
</div>
<div id="hint">👆 Крути пальцем · 🤏 Щипок для зума</div>

<script>
(function() {
  'use strict';
  const viewer = document.getElementById('viewer');
  const card   = document.getElementById('card');
  const hint   = document.getElementById('hint');

  let rx = -3, ry = 0, scale = 1;
  let idle = true;
  const idleStart = performance.now();

  const pointers = new Map();
  let isDragging = false;
  let lastX = 0, lastY = 0;
  let velRy = 0, velRx = 0;
  let lastDist = 0;
  let downTime = 0;
  let downX = 0, downY = 0;

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function applyTransform() {
    card.style.transform = `scale(${scale}) rotateX(${rx}deg) rotateY(${ry}deg)`;
  }
  function stopIdle() { if (idle) { idle = false; hint.classList.add('hidden'); } }

  function idleLoop(now) {
    if (!idle) return;
    const t = (now - idleStart) / 1000;
    ry = Math.sin(t * 0.6) * 10;
    rx = -3 + Math.sin(t * 0.9) * 4;
    applyTransform();
    requestAnimationFrame(idleLoop);
  }

  function getDist() {
    const p = [...pointers.values()];
    if (p.length < 2) return 0;
    return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
  }

  viewer.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    try { viewer.setPointerCapture(e.pointerId); } catch(_) {}
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pointers.size === 1) {
      stopIdle();
      isDragging = true;
      lastX = e.clientX; lastY = e.clientY;
      velRy = 0; velRx = 0;
      downTime = performance.now();
      downX = e.clientX; downY = e.clientY;
    } else if (pointers.size === 2) {
      stopIdle();
      isDragging = false;
      lastDist = getDist();
    }
  });

  viewer.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    e.preventDefault();
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pointers.size === 1 && isDragging) {
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      ry += dx * 0.4;
      rx = clamp(rx - dy * 0.4, -75, 75);
      velRy = dx * 0.4;
      velRx = -dy * 0.4;
      lastX = e.clientX; lastY = e.clientY;
      applyTransform();
    } else if (pointers.size === 2) {
      const d = getDist();
      if (lastDist > 0) {
        scale = clamp(scale * (d / lastDist), 0.6, 3.5);
        applyTransform();
      }
      lastDist = d;
    }
  });

  function onUp(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);

    if (pointers.size === 1) {
      const rem = [...pointers.values()][0];
      lastX = rem.x; lastY = rem.y;
      isDragging = true;
      velRy = 0; velRx = 0;
      lastDist = 0;
    } else if (pointers.size === 0) {
      isDragging = false;
      const dt = performance.now() - downTime;
      const move = Math.hypot(e.clientX - downX, e.clientY - downY);
      if (dt < 250 && move < 15) {
        confetti({ count: 55, power: 13, x: e.clientX, y: e.clientY, spread: 160 });
      } else {
        const decay = () => {
          if (pointers.size > 0) return;
          if (Math.abs(velRy) < 0.05 && Math.abs(velRx) < 0.05) return;
          ry += velRy;
          rx = clamp(rx + velRx, -75, 75);
          velRy *= 0.93; velRx *= 0.93;
          applyTransform();
          requestAnimationFrame(decay);
        };
        decay();
      }
    }
  }
  viewer.addEventListener('pointerup', onUp);
  viewer.addEventListener('pointercancel', onUp);

  viewer.addEventListener('wheel', (e) => {
    e.preventDefault();
    stopIdle();
    scale = clamp(scale * (e.deltaY > 0 ? 0.92 : 1.08), 0.6, 3.5);
    applyTransform();
  }, { passive: false });

  // 🎊 Конфетти
  function confetti(opts = {}) {
    const canvas = document.createElement('canvas');
    canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:100;';
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    canvas.width  = window.innerWidth  * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.scale(dpr, dpr);

    const colors = ['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#54a0ff','#5f27cd','#1dd1a1','#ff9f43','#ee5a24','#f368e0','#ffd93d','#ff4757'];
    const count  = opts.count || 180;
    const startX = opts.x ?? window.innerWidth / 2;
    const startY = opts.y ?? window.innerHeight / 2;
    const spread = opts.spread || 500;
    const power  = opts.power  || 18;
    const pieces = [];

    for (let i = 0; i < count; i++) {
      const angle = (Math.random() - 0.5) * Math.PI * 0.9 - Math.PI / 2;
      const speed = Math.random() * power + 4;
      pieces.push({
        x: startX + (Math.random() - 0.5) * spread * 0.3,
        y: startY,
        vx: Math.cos(angle) * speed * (Math.random() * 0.8 + 0.6) + (Math.random() - 0.5) * 4,
        vy: Math.sin(angle) * speed - Math.random() * 6,
        size: 6 + Math.random() * 9,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.35,
        shape: Math.random() > 0.4 ? 'rect' : 'circle',
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: 0.05 + Math.random() * 0.1
      });
    }

    const startTime = performance.now();
    const duration = 6000;

    function animate(now) {
      const elapsed = now - startTime;
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      let alive = 0;
      for (const p of pieces) {
        p.vy += 0.45; p.vx *= 0.992; p.vy *= 0.995;
        p.wobble += p.wobbleSpeed;
        p.x += p.vx + Math.sin(p.wobble) * 1.2;
        p.y += p.vy;
        p.rotation += p.vrot;
        if (p.y < window.innerHeight + 60) {
          alive++;
          const alpha = Math.max(0, 1 - elapsed / duration);
          ctx.save();
          ctx.translate(p.x, p.y); ctx.rotate(p.rotation);
          ctx.fillStyle = p.color; ctx.globalAlpha = alpha;
          if (p.shape === 'rect') {
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
          } else {
            ctx.beginPath(); ctx.arc(0, 0, p.size / 2.5, 0, Math.PI * 2); ctx.fill();
          }
          ctx.restore();
        }
      }
      if (alive > 0 && elapsed < duration) requestAnimationFrame(animate);
      else canvas.remove();
    }
    requestAnimationFrame(animate);
  }

  // Init
  applyTransform();
  requestAnimationFrame(idleLoop);
  setTimeout(() => confetti({ count: 150, power: 20 }), 300);
  setTimeout(() => confetti({ count: 120, power: 18, x: window.innerWidth * 0.2 }), 1200);
  setTimeout(() => confetti({ count: 120, power: 18, x: window.innerWidth * 0.8 }), 1200);
  setTimeout(() => confetti({ count: 180, power: 22 }), 2200);
  setTimeout(() => hint.classList.add('hidden'), 9000);
})();
</script>
</body>
</html>
